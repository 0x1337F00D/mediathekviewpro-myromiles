services:
  mediathek-addon:
    build:
      context: .
      network: host
    image: mediathek-sackfloete:1.3.0
    container_name: mediathek-addon
    restart: unless-stopped
    dns: [172.31.53.1]
    environment:
      PUBLIC_BASE_URL: https://sackfloete.duckdns.org/mediathek
      NODE_ENV: production
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.4
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:7000/manifest.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [stack]
networks:
  stack:
    external: true
    name: aiostreams_default
